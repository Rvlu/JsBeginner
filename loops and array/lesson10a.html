<!DOCTYPE html>
<html>
  <head> 
    <title>
      Practice buttons
    </title>

    <style>

      body{
        font-family: Arial;

      }
      
      .cart-btn{
        background-color: rgb(255, 216, 20);
        border: none;
        padding: 5px;
        padding-left: 20px;
        padding-right: 20px;
        border-radius: 50px;
        font-weight: 20px;
        cursor: pointer;
      }

      .req-btn{
        background-color: black;
        color: white;
        font-weight: 100;
        padding: 10px 20px;
        border-radius: 5px;
        border: none;
        cursor: pointer;
      }

      .sched-btn{
        border: none;
        background-color: rgb(230, 230, 230);
        padding: 10px 20px;
        border-radius: 5px;
        font-size: 14px;
        cursor: pointer;
      }

    </style>

  </head> 
  
  

  <body>
    <p>Amazon Button</p>

<button class="cart-btn">
Add to Cart
</button>




<br>
<br>


<p>Uber buttons</p>

<button class="req-btn">Request now</button> 
<button class="sched-btn">Schedule for later</button>

  </body>
</html>
