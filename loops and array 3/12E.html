<!DOCTYPE html>
<html lang="en">
<head>
  <title>Document</title>
</head>
<body>
  <button onclick="addToCart();">Add to cart</button>
  <p class="message"></p>

  <script>
    let timeoutId;

    function addToCart (){
      const add = document.querySelector('.message');
      add.innerHTML = 'Added';

      clearTimeout(timeoutId);
      
      setTimeout(() => {
        add.innerHTML = '';
      }, 2000);

     
    }

  </script>
</body>
</html>
