  <body>


<script>
// --- 11D creating loops that counts 0 to 10, but counts up by 2.--

for (let i = 0; i <= 10; i += 2) {
  console.log(i);
}



// 11E create a for loops that counts down from 5 to 0. --


    for (let i = 5; i >= 0; i--) {
            console.log(i);
          }

   // example 2
          for (let i = 10; i >= 1; i--){
            console.log(i)
          }



// 11F same like 11D and E but using while loops--------

    //--first example , counts 0 - 10 but counts up by 2.
      let i = 0;

      while (i <= 10){
        console.log(i);
        i += 2;
      }
  
    // --second example, counts down from 5-0.
        i = 5;

        while(i >= 0){
          console.log(i);
          i--;
        }
    


</script>
