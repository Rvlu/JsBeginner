//--- lesson 11B exercises function that take the last array and returns the last value in the array.--------------//

    function getLastValue(array) {
     const lastIndex = array.length - 1;
     return array[lastIndex];
    }

    console.log(getLastValue([1, 20, 22, 24, 5]));
   console.log(getLastValue(['hi', 'hello', 'good']));


function myArray(array){
  const lastIndex = array.length - 1;
  return  array[lastIndex];
}

console.log(myArray([10, 20, 30, 40, 50, 60]));


//---11C exercises function that takes an array and returns ann array where the first and last value are swap or switched. -------------------------

function arraySwap(array) {
  const lastIndex = array.length -1;

  const lastValue = array[lastIndex];
  const firstValue = array[0];

  array[0] = lastValue;
  array[lastIndex] = firstValue;

  return array;
  
}
console.log(arraySwap([1, 20, 22, 24, 5]));
console.log(arraySwap([1, 20, 22, 24, 5]));
console.log(arraySwap(['hi', 'hello', 'hey']));


function arraySwap (array){

  const lastIndex = array.length -1;


        // We need to save the values first before
        // swapping. Otherwise, if we swap directly,
        // we would lose one of the values.
  const lastValue = array[lastIndex];
  const firstValue = array[0];


  array[0] = lastValue;
  array[lastIndex] = firstValue;

  return array;
}
  
console.log(arraySwap([200, 100, 400, 600]));
