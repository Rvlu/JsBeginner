<!DOCTYPE html>
<html lang="en">
<head>
 
  <title>Document</title>
</head>
<body>
  <script>
    function unique(array)  {
        const result = [];

        for (let i = 0; i < array.length; i++) {
        
          if (result.indexOf(array[i]) === -1) {
            result.push(array[i]);
          }
        }

        return result;
      }

      console.log(unique(['green', 'red', 'blue', 'red']));
  </script>
</body>
</html>
