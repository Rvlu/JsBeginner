  <script>

    //--- 11I function that takes an array of numbers and returns an array where each number is increase by 'num.'
    function addnum(array, num){
      const result = [];

      for (let i = 0; i < array.length; i++){
        result.push(array[i] + num);
      }
        return result;
    }

    console.log(addnum([1, 2, 3], 2));
    console.log(addnum([1, 2, 3], 3));
    console.log(addnum([-2, -1, 0, 99], 2));


    //----11J funtion that takes 2 arrays of numbers and add each number in arrays together.

      function addArrays(array1, array2){
        const result = [];

        for (let i = 0; i < array1.length; i++){
          result.push(array1[i] + array2[i]); 
        }
        return result;
      }

      console.log(addArrays([1, 1, 2], [1, 1, 3]));
      console.log(addArrays([1, 2, 3], [4, 5, 6]));



    // ----11K its how many numbers in the array are greater than 0.

      function countPositive(nums){
        let result = 0;

        for(let i = 0; i < nums.length; i++){
          if(nums[i] > 0){
            result++;
          }
        }
        return result;
      }

      console.log(countPositive([1, -3, 5]));
      console.log(countPositive([-2, 3, -5, 7, 10]));
  </script>
